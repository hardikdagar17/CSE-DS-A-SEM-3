<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Section-A Quiz</title>

    <link rel="stylesheet" href="Quiz.css">
</head>

<body>

    <div id="login">

        <div class="quiz-icon">?</div>

        <h1>Section-A Quiz</h1>

        <p class="subtitle">Enter your details to start the quiz</p>

        <div class="input-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>

        <button id="start">Start Quiz</button>

    </div>


    <div id="quiz">

        <div class="quiz-header">

            <div>
                <span class="small-text">SECTION-A</span>
                <h2 id="question"></h2>
            </div>

            <div class="timer-box">
                <span>TIME</span>
                <strong id="time">60</strong>
            </div>

        </div>

        <div class="progress-container">
            <div id="progress"></div>
        </div>

        <p id="questionNumber">Question 1 of 4</p>

        <div class="options">

            <button id="a" class="answer-btn"></button>

            <button id="b" class="answer-btn"></button>

            <button id="c" class="answer-btn"></button>

            <button id="d" class="answer-btn"></button>

        </div>

        <button id="next">Next</button>

    </div>


    <div id="result">

        <div class="result-icon">✓</div>

        <h2>Quiz Completed!</h2>

        <p id="resultText"></p>

        <button id="restart">Take Quiz Again</button>

    </div>


    <script src="Quiz.js"></script>

</body>

</html>
